# Server Configuration
server.port=8000
server.servlet.context-path=/

# Application Name
spring.application.name=api-gateway

# Gateway Configuration
spring.cloud.gateway.routes[0].id=admin-auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8001
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=admin-service
spring.cloud.gateway.routes[1].uri=http://localhost:8001
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/admin/(?<segment>.*), /api/${segment}

spring.cloud.gateway.routes[2].id=medical-service
spring.cloud.gateway.routes[2].uri=http://localhost:8002
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/medical/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/medical/(?<segment>.*), /api/medical/${segment}

spring.cloud.gateway.routes[3].id=pharmacy-service
spring.cloud.gateway.routes[3].uri=http://localhost:8004
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pharmacy/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/pharmacy/(?<segment>.*), /api/pharmacy/${segment}

spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=http://localhost:8003
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payment/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/payment/(?<segment>.*), /api/payment/${segment}

# JWT Configuration
jwt.secret=GrowBussinessSecretKeyForJWTTokenGenerationAndValidation1234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# SpringDoc – OpenAPI dari YAML (JSON di /v3/api-docs untuk Swagger UI)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.validator-url=none
springdoc.swagger-ui.disable-swagger-default-url=true

# Logging
logging.level.root=INFO
logging.level.com.example.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
